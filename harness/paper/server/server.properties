# The Paper harness's server (Plan.md P16.1, ADR-0049): offline mode, a flat
# world, RCON only inside the container. Test-only. The container's start adds
# rcon.password, new at every start.
online-mode=false
enforce-secure-profile=false
level-type=minecraft\:flat
# The default flat world's layers, written out: Paper reads an empty setting as an error.
generator-settings={"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:dirt","height":2},{"block":"minecraft:grass_block","height":1}],"biome":"minecraft:plains"}
generate-structures=false
view-distance=4
simulation-distance=4
spawn-protection=0
gamemode=survival
difficulty=peaceful
max-players=20
server-port=25565
enable-rcon=true
rcon.port=25575
enable-query=false
motd=afkfleet harness
