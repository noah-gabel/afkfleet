packages:
  - "apps/*"
  - "packages/*"

# No release younger than 3 days (in minutes) is resolved, transitive ones included
# (ADR-0017). A fix that can't wait goes into `minimumReleaseAgeExclude`, with a comment
# saying why and the user's approval.
minimumReleaseAge: 4320
patchedDependencies:
  sonner@2.0.8: patches/sonner@2.0.8.patch
