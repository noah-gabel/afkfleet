# The stack (Plan.md P12.1, P12.2, P12.7; ADR-0022, S13, S19, U16): both images built natively
# on GitHub's linux/arm64 runner, production's architecture, and on linux/amd64. It runs nightly,
# on demand, and on the pull requests that touch what the images and the compose project are built
# from (never crates/ alone, which nearly every pull request touches; ADR-0014's rule is that no
# job builds the images on every pull request). Nothing is pushed or published, and it's never a
# required check, so a pull request it doesn't run on is never blocked. Third-party actions are
# pinned to full commit SHAs (version in the comment), as in ci.yml.
name: Stack

on:
  schedule:
    - cron: "37 2 * * *" # nightly, 02:37 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "deploy/**"
      - ".dockerignore"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/stack.yml"

permissions:
  contents: read

concurrency:
  group: stack-${{ github.ref }}
  cancel-in-progress: true

env:
  JUST_VERSION: "1.58.0"

jobs:
  stack:
    name: stack (${{ matrix.runner }})
    strategy:
      # Each architecture's result stands alone.
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    # Both images build cold: no cache crosses runs.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: just@${{ env.JUST_VERSION }}
      - run: just images
