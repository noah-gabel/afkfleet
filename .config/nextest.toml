# cargo-nextest profiles.
# Slow tests (containers, real Minecraft) are named `slow_*`, either at the top
# level of an integration test or inside a module. nextest matches the full test
# path (e.g. `tests::slow_join`), hence `(^|::)` instead of `^`.
# Manual tests (`manual_*`) need the user's real credentials, so only the user
# runs them, with `just test-real-account`; no other profile includes them
# (ADR-0011).

[profile.default]
default-filter = "not test(/(^|::)(slow|manual)_/)"

[profile.slow]
default-filter = "test(/(^|::)slow_/)"
# Containers and the Minecraft server take a while to start.
slow-timeout = { period = "60s", terminate-after = 10 }

# Each slow test starts its own Minecraft container (nextest can't share one
# between test processes), so they run one at a time (ADR-0011).
[[profile.slow.overrides]]
filter = "test(/(^|::)slow_/)"
test-group = "minecraft"

# The user's real-account check. The AI never runs this profile.
[profile.manual]
default-filter = "test(/(^|::)manual_/)"
slow-timeout = { period = "60s", terminate-after = 10 }

[[profile.manual.overrides]]
filter = "test(/(^|::)manual_/)"
test-group = "minecraft"

[test-groups]
minecraft = { max-threads = 1 }

[profile.ci]
default-filter = "not test(/(^|::)(slow|manual)_/)"
retries = 0
fail-fast = false

[profile.ci.junit]
path = "junit.xml"
