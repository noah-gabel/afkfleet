<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <title>afkfleet</title>
  <!-- Orbit (ADR-0020, U95): an open ring and one bright satellite on a graphite tile, on watch while you're away. Our own geometry. Change it here, change the marks in packages/ui/src/components/Brand.tsx, which draws them without the tile and which a test keeps equal, keep icon-16.svg in step, then run just icons. -->
  <defs><linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2f35"/><stop offset="1" stop-color="#101316"/></linearGradient><linearGradient id="ring" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a9cdec"/><stop offset="1" stop-color="#2f6291"/></linearGradient></defs>
  <rect width="1024" height="1024" rx="210" fill="url(#tile)"/>
  <rect x="10" y="10" width="1004" height="1004" rx="200" fill="none" stroke="#ffffff" stroke-opacity=".09" stroke-width="20"/>
  <path d="M 700 262 A 312 312 0 1 1 262 324" fill="none" stroke="url(#ring)" stroke-width="88" stroke-linecap="round"/>
  <circle cx="512" cy="512" r="66" fill="#3f78ab"/>
  <circle cx="768" cy="226" r="92" fill="#e4f0fa"/>
</svg>
