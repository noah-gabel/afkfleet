[workspace]
resolver = "3"
# The desktop app's Rust side lives next to its frontend (Plan.md §4). It ships only for
# Windows, so Linux CI excludes it and the justfile adds the flag (ADR-0017).
members = ["crates/*", "apps/desktop/src-tauri"]
# Spikes are throwaway experiments with their own Cargo.lock (Plan.md §4).
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
repository = "https://github.com/noah-gabel/afkfleet"

# A dependency is declared here when a crate first uses it, never in advance: cargo
# warns about unused workspace dependencies. Plan.md §5 lists the verified version and
# any feature constraints for every registry crate (pinned in P0.3).
#
# Version policy (ADR-0009): a caret requirement on the full version, with Cargo.lock as
# the exact pin; `=` only where semver can't express the constraint (azalea).
# Features that choose a TLS stack or crypto provider are fixed here: rustls with
# aws-lc-rs only; no ring, native-tls or webpki-roots. All other features are enabled
# by the member that uses the crate.
[workspace.dependencies]
# Workspace crates, by path (unpublished, so no version).
fleet-api-types = { path = "crates/fleet-api-types" }
# fleet-client: the desktop app's Rust side talks to the server only through it (ADR-0017).
fleet-client = { path = "crates/fleet-client" }
fleet-core = { path = "crates/fleet-core" }
fleet-mc = { path = "crates/fleet-mc" }
fleet-runtime = { path = "crates/fleet-runtime" }
# fleet-server: fleet-client's integration tests run it in-process (ADR-0017).
fleet-server = { path = "crates/fleet-server" }
fleet-startup = { path = "crates/fleet-startup" }
fleet-testkit = { path = "crates/fleet-testkit" }

# azalea: exact pin (ADR-0003), fleet-mc only. Without default features: `log` would
# add Bevy's LogPlugin to every App, and `packet-event` floods the event channel
# (ADR-0008 §4). fleet-mc enables `online-mode`.
azalea = { version = "=0.16.0", default-features = false }
# azalea-chat and azalea-language: the same exact pin as azalea, which already depends on
# both. fleet-mc only, for its bounded renderer of server text: azalea doesn't re-export
# the chat argument type, and its own rendering grows exponentially (ADR-0011).
azalea-chat = "=0.16.0"
azalea-language = "=0.16.0"

# argon2: fleet-server's password service (Argon2id). Without default features, so its
# `getrandom` is off and salts come from the SecureRandom port through
# `hash_password_with_salt`; `zeroize` wipes its memory blocks (ADR-0016).
argon2 = { version = "0.6.0", default-features = false }
# async-trait: fleet-server's ports, which services hold as `Arc<dyn …>`; generics and
# `impl Future` everywhere else (ADR-0015).
async-trait = "0.1.92"
# axum: fleet-server's HTTP layer. Without default features; the server enables only
# what it uses: `json` arrives with the first request DTOs (P7, group D), and brings
# serde_path_to_error (ADR-0015, ADR-0016).
axum = { version = "0.8.9", default-features = false }
# axum-extra: `TypedHeader<Authorization<Bearer>>` for the server's AuthUser extractor.
# Without default features (no `tracing`); fleet-server enables only `typed-header`,
# which brings headers 0.4 (ADR-0016).
axum-extra = { version = "0.12.6", default-features = false }
# base64: the vault's key files (standard alphabet, padded), decoded with `decode_slice`
# into a fixed buffer. Without default features: `simd-unsafe`, its only unsafe code, stays
# off, so the crate is `forbid(unsafe_code)` (ADR-0016).
base64 = { version = "0.23.1", default-features = false }
# backon: without default features only fastrand is left; the defaults pull in tokio.
backon = { version = "1.6.0", default-features = false }
# chrono: no `clock`/`now`, because fleet-core takes time as a parameter (ADR-0010).
# Only the agent and fleet-server enable `now` (= `std`): the agent for its one wall-clock
# read at startup, the server for its SystemClock. `clock` would add local time zones,
# which nothing uses (ADR-0014, ADR-0015).
chrono = { version = "0.4.45", default-features = false }
# chacha20poly1305: the vault's XChaCha20-Poly1305. Without default features, so its
# `getrandom` is off and nonces come from the SecureRandom port (ADR-0016).
chacha20poly1305 = { version = "0.11.0", default-features = false }
# clap: the agent's command line; the member enables `derive` (ADR-0014).
clap = "4.6.7"
# figment: the binaries' configs, TOML plus prefixed env variables. No default features
# exist; fleet-startup enables `toml` and `env`, and fleet-testkit `test` (`Jail`) for
# every config test (ADR-0014, ADR-0015).
figment = "0.10.19"
# garde: range checks on the agent's config, and the rules of fleet-api-types' request
# DTOs. No default features exist; the members enable `derive` (ADR-0014, ADR-0016).
garde = "0.23.0"
# getrandom: every secret, the agent's bot IDs and runtime seed, and fleet-server's
# OsRandom. No features: `fill` and `u64` need none (ADR-0014, ADR-0015).
getrandom = "0.4.3"
# governor: the defaults add `quanta`, `dashmap` and `jitter`, and `jitter` pulls rand 0.9
# and getrandom 0.3 into normal dependencies. fleet-runtime enables `std` and runs its
# chat bucket on a tokio-backed clock (ADR-0013). fleet-server enables `std` too, for its
# keyed HTTP limiters on the server's Clock port; no tower_governor, which would force the
# defaults and its own clock (ADR-0016).
governor = { version = "0.10.4", default-features = false }
# hmac: HMAC-SHA256 keys of the per-username lockout's rows, so a row never holds the
# typed name, and the derivation of their key from the vault's. fleet-server enables
# `zeroize`, which wipes the keyed state. RustCrypto like sha2 0.11; already in Cargo.lock
# (ADR-0016).
hmac = "0.13.0"
# keyring-core: the desktop app's keychain entries, built from an explicit store (no global
# default store). No default features exist besides the optional `sample` store
# (ADR-0017).
keyring-core = "1.0.0"
# log: fleet-server names `log::LevelFilter` only, because sqlx's statement-logging
# levels take it; its logging macros are banned there (ADR-0015). In tests, fleet-testkit's
# log capture and fleet-agent's telemetry emit `log` records to prove the bridge
# (ADR-0011, ADR-0014).
log = "0.4.34"
# metrics: the facade only, with no features; its one dependency is rapidhash. The agent
# installs the Prometheus exporter (P5.3); fleet-runtime records into it (ADR-0013).
metrics = "0.24.6"
# metrics-exporter-prometheus: no features. The defaults add a push gateway with its own
# TLS stack, and the agent only installs the recorder until P12.4 enables `http-listener`.
# Its metrics-util dependency always enables `storage`, which brings rand 0.9
# (thread_rng) and getrandom 0.3 into normal dependencies; both were already in the
# lockfile, and nothing uses them for secrets. One `metrics` 0.24.x in the tree keeps
# the runtime and the exporter on the same recorder (ADR-0014).
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
# qrcodegen: the QR code of a TOTP enrollment's otpauth URI; fleet-server writes its
# modules as an SVG itself, so no image codec joins the tree. It has no dependencies
# (ADR-0016).
qrcodegen = "1.8.0"
# rand: no `sys_rng`/`thread_rng`; fleet-core takes an RNG as a parameter (ADR-0010).
rand = { version = "0.10.3", default-features = false }
# rpassword: `user create-owner`'s hidden password prompt at the terminal (ADR-0016).
rpassword = "7.5.4"
# reqwest: TLS is fixed here, `rustls` (aws-lc-rs + platform verifier), never native-tls.
# fleet-mc enables nothing else: it only names `reqwest::Proxy` in azalea's `AccountTrait`,
# and azalea-auth already builds reqwest with `rustls` (ADR-0011). fleet-client enables
# nothing else either: it writes and reads JSON with serde_json and builds queries on
# reqwest's `Url` (ADR-0017).
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
# rustls: the default features select the aws-lc-rs provider, which the agent installs
# at startup; never ring (deny.toml) (ADR-0014). 0.23.46 is a security floor:
# RUSTSEC-2026-0346 to 0349.
rustls = "0.23.46"
# secrecy: `SecretString` with a redacted `Debug`; it has no default features and only
# pulls in zeroize (alloc).
secrecy = "0.10.3"
serde = "1.0.229"
# sha2: SHA-256 of the session tokens; only the hash is stored (ADR-0006). Without
# default features (no `alloc`, no `oid`); fleet-server enables `zeroize`, which wipes
# the hasher's block buffer (ADR-0016). Already in Cargo.lock through sqlx and azalea.
sha2 = { version = "0.11.0", default-features = false }
# subtle: constant-time comparison of secrets, first the vault's duplicate-key check
# (ADR-0016).
subtle = "2.6.1"
thiserror = "2.0.21"
# sqlx: SQLite through the bundled library only (`sqlite-bundled`, not `sqlite`, which
# adds extension loading, deserialize and unlock-notify), with `runtime-tokio`, `macros`
# and `migrate`, plus `uuid` for binding IDs as `uuid::fmt::Hyphenated`. No TLS feature,
# and no `chrono` (it would turn on chrono's `clock` for the whole workspace) or `json`:
# times and JSON are converted in fleet-server (ADR-0015).
sqlx = { version = "0.9.0", default-features = false }
# tauri: the desktop app's shell (≥ 2.11.1 for CVE-2026-42184). Without default features:
# the desktop crate enables `wry` and `compression`, but never `common-controls-v6` (it
# breaks Windows test executables), `dynamic-acl` (runtime `add_capability`: the ACL stays what the build resolved), the
# Linux-only `x11`/`dbus`, or `devtools` (debug builds have devtools anyway). The CLI adds
# `custom-protocol` for `tauri build` (ADR-0017).
tauri = { version = "2.12.3", default-features = false }
# tauri-build: the desktop crate's build script; it embeds the Windows icon and resolves
# the capabilities and the app's command manifest at build time (ADR-0017).
tauri-build = "2.7.2"
# tauri-plugin-single-instance: a second launch focuses the running window instead of
# opening another. It has no JavaScript API, so no capability grants it anything
# (ADR-0017).
tauri-plugin-single-instance = "2.5.3"
# totp-rs: one time step's TOTP code and the otpauth URI of an enrollment. Without
# default features: no `std` (wall-clock `*_current`), no `gen_secret` (rand's thread RNG;
# the secret comes from the SecureRandom port), no `serde`, no `qr` (image codecs).
# fleet-server enables `otpauth` and `zeroize`, which wipes its Secret on drop (ADR-0016).
totp-rs = { version = "6.0.0", default-features = false }
# tokio: no default features exist; members enable only what they use (`sync`,
# `time`, …) and `test-util` in tests.
tokio = "1.53.2"
# tokio-util: fleet-runtime enables no features; it uses only `CancellationToken` (ADR-0013).
# fleet-server enables `rt` for the session-token service's `TaskTracker`, which pulls in only
# futures-util, already in its tree (ADR-0018).
tokio-util = { version = "0.7.19", default-features = false }
# tower: fleet-server builds its middleware stack with `ServiceBuilder` (no feature); its
# handler tests enable `util` for `ServiceExt::oneshot` (ADR-0015).
tower = { version = "0.5.3", default-features = false }
# tower-http: fleet-server's middleware. It has no default features; the server enables
# only the layers it uses. Never `request-id` (it turns on uuid's `v4`, and with it `rng`)
# or `trace`: the server's request-ID and trace layers are its own (ADR-0015).
tower-http = "0.7.1"
tracing = "0.1.44"
# tracing-subscriber: the default features include `tracing-log`, which bridges `log`
# records into fleet-testkit's log capture for the redaction tests (ADR-0011).
tracing-subscriber = "0.3.23"
# ts-rs: fleet-api-types' TypeScript export. Without default features; the member enables
# `serde-compat`, so serde's renames reach the TypeScript. `chrono-impl` and `uuid-impl`
# come with the first DTO that holds a time or an ID (ADR-0015).
ts-rs = { version = "12.0.1", default-features = false }
# utoipa: the OpenAPI document, served only in dev mode (P6.10). Without default features;
# fleet-api-types and fleet-server enable `macros` (`ToSchema`, `OpenApi`, `path`). It
# describes what the DTOs put on the wire, and a test keeps it equal to the ts-rs export
# (ADR-0015).
utoipa = { version = "6.0.0", default-features = false }
# utoipa-axum: fleet-server registers its routes through `OpenApiRouter`, so a route can't
# exist without its OpenAPI entry. It takes axum without default features (ADR-0015).
utoipa-axum = "0.3.0"
# uuid: never `v4`/`v7`/`rng`, which pull in getrandom; IDs are minted from caller data (ADR-0010).
uuid = { version = "1.27.0", default-features = false }
# windows-native-keyring-store: the Windows Credential Manager behind keyring-core, for the
# desktop app's refresh token. Without default features: `search` (and its regex) is off,
# since the app only builds entries by service and account (ADR-0017).
windows-native-keyring-store = { version = "1.1.0", default-features = false }
# zeroize: `Zeroizing` buffers for secret files and passwords read from stdin; secrecy
# already depends on it (ADR-0016).
zeroize = "1.9.0"
# zxcvbn: the strength check of new passwords. Without default features (that drops
# `derive_builder`). It reads the wall clock itself for its "recent years" rule (ADR-0016).
zxcvbn = { version = "3.1.1", default-features = false }

# Tests
insta = "1.49.0"
# ipnet: dev only, fleet-server's property test that checks its own IpNet against it;
# production code never uses it. Already in Cargo.lock through reqwest (ADR-0016).
ipnet = "2.12.2"
# proptest and rstest: members enable only what they need (ADR-0010). proptest's
# `std` keeps `PROPTEST_CASES` working.
proptest = { version = "1.11.0", default-features = false }
rstest = { version = "0.27.0", default-features = false }
# rcgen: fleet-client's TLS tests make a CA and server certificates with it at run time,
# since no key is ever committed. Without default features, which select ring; the
# member enables `aws_lc_rs` and `pem` (ADR-0017). P10's PKI will use it in production.
rcgen = { version = "0.14.10", default-features = false }
# serde_json: also fleet-testkit's log buffer, which parses JSON log lines (ADR-0015).
serde_json = "1.0.151"
# tempfile: fleet-server's database tests open real files in a fresh folder; already in
# the lockfile through figment and insta (ADR-0015).
tempfile = "3.27.0"
# testcontainers: no default features, since `ring` turns on TLS for the Docker client,
# which the local socket and named pipe don't need (and deny.toml bans ring). fleet-mc's
# slow tests start itzg/minecraft-server with it (ADR-0011).
testcontainers = { version = "0.28.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
indexing_slicing = "deny"
await_holding_lock = "deny"
large_futures = "warn"

# Every test hashes passwords at §7.2's real baseline (no cheaper parameters exist), so
# argon2, its blake2 and zxcvbn are optimized in dev builds, which tests inherit: about
# 10 ms per hash instead of 228 ms, measured (ADR-0016).
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.dev.package.zxcvbn]
opt-level = 3

[profile.release]
panic = "unwind"
overflow-checks = true
lto = "thin"
