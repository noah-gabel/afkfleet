[package]
name = "azalea-spike"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
description = "Throwaway (Phase 1): experiments that de-risk azalea before fleet-mc is built. Findings live in ADR-0008."

[dependencies]
# 0.16.0+mc26.1, exact pin (ADR-0003). Default features off: `log` would add
# Bevy's LogPlugin to every App, which fights our own tracing subscriber.
azalea = { version = "=0.16.0", default-features = false, features = ["online-mode", "packet-event"] }
tokio = { version = "1.53.2", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# P1.8: `AccountTrait` names `uuid::Uuid` and `reqwest::Proxy`.
uuid = { version = "1.27.0", default-features = false }
reqwest = { version = "0.13.5", default-features = false }
