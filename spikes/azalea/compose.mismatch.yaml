# Phase 1 spike only (P1.3): a second local offline-mode server on ANOTHER
# Minecraft version, to see what azalea 0.16.0 (Minecraft 26.1) gets when the
# versions don't match. Bound to 127.0.0.1:25566 only; never expose it.
#
#   MC_MISMATCH_VERSION=26.3 docker compose --file spikes/azalea/compose.mismatch.yaml up --detach --wait
#   docker compose --file spikes/azalea/compose.mismatch.yaml down --volumes
name: afkfleet-p1-mismatch

services:
  minecraft:
    # Same pinned image as deploy/compose.dev.yaml.
    image: itzg/minecraft-server:2026.9.2-java25@sha256:de5d1b1a83eba576f6c8a688fac2a3523ce457724cdebc8ea48d7818b74cdf6e
    environment:
      EULA: "TRUE"
      TYPE: VANILLA
      VERSION: ${MC_MISMATCH_VERSION:-26.3}
      ONLINE_MODE: "FALSE"
      ENFORCE_SECURE_PROFILE: "FALSE"
      LEVEL_TYPE: minecraft:flat
      VIEW_DISTANCE: "3"
      SIMULATION_DISTANCE: "3"
      ENABLE_AUTOPAUSE: "FALSE"
      MEMORY: 1G
    ports:
      - "127.0.0.1:25566:25565"
    healthcheck:
      test: mc-health
      start_period: 3m
      interval: 5s
      retries: 20
