[package]
name = "fleet-api-types"
description = "The DTOs of afkfleet's HTTP API, shared by the server, the client and the app, and exported to TypeScript with ts-rs."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# `Timestamp`, a response's point in time, written and read by hand without any of chrono's
# features (ADR-0016).
chrono.workspace = true
# `text::sanitize_untrusted`, which cleans every text a client reads (ADR-0015).
fleet-core.workspace = true
# The request DTOs' rules, checked at the server's boundary (ADR-0016).
garde = { workspace = true, features = ["derive"] }
# `SecretText::into_secret`, which hands a secret field to the server (ADR-0016).
secrecy.workspace = true
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true
# The TypeScript export; `serde-compat` carries serde's renames into it (ADR-0015).
ts-rs = { workspace = true, features = ["serde-compat"] }
# The OpenAPI schemas, which describe the same wire types as the TypeScript. With
# `preserve_order`, properties keep the struct's field order, as ts-rs's output does, so
# a test compares the two directly (ADR-0015).
utoipa = { workspace = true, features = ["macros", "preserve_order"] }
# `SecretText` wipes its text on drop (ADR-0016).
zeroize.workspace = true

[dev-dependencies]
rstest.workspace = true
serde_json.workspace = true
# A fresh folder for each export: the tests' and the exporter example's (ADR-0015).
tempfile.workspace = true
