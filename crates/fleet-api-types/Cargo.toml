[package]
name = "fleet-api-types"
description = "The DTOs of afkfleet's HTTP API, shared by the server, the client and the app, and exported to TypeScript with ts-rs."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# `text::sanitize_untrusted`, which cleans every text a client reads (ADR-0015).
fleet-core.workspace = true
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true
# The TypeScript export; `serde-compat` carries serde's renames into it (ADR-0015).
ts-rs = { workspace = true, features = ["serde-compat"] }

[dev-dependencies]
rstest.workspace = true
serde_json.workspace = true
# A fresh folder for each export: the tests' and the exporter example's (ADR-0015).
tempfile.workspace = true
