[package]
name = "fleet-runtime"
description = "The bot runtime of afkfleet: one supervised actor per bot, with its mode runner, chat queue and watchdog. Generic over the fleet-core ports; it never sees azalea."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# `DateTime` only: the runtime never reads the wall clock (ADR-0013).
chrono.workspace = true
fleet-core.workspace = true
governor = { workspace = true, features = ["std"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "sync", "time"] }
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
fleet-testkit.workspace = true
proptest = { workspace = true, features = ["std"] }
rstest.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
