# fleet-server's own clippy configuration. Clippy reads the nearest clippy.toml
# and doesn't merge it with the root one, so the root file's test allowances and
# its ban on unbounded channels are repeated here. `just scripts-test` checks that
# this file carries every root setting (scripts/clippy-config.mjs).
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
allow-print-in-tests = true

# fleet-server reads the wall clock and the OS's randomness only through the
# Clock and SecureRandom ports (ADR-0015): SystemClock and OsRandom in
# `infra::system` are the one approved exception each, so tests control time and
# randomness everywhere else. uuid's own minting reads the clock or the OS
# itself; IDs are minted with `fleet_core::system::mint` instead. tokio's
# `Instant::now` stays allowed: it's the runtime's clock for timeouts.
# `allow-invalid` marks the paths that don't exist in fleet-server's own feature
# set; a temporary probe proved that every entry fires (ADR-0015).
disallowed-methods = [
    { path = "std::time::Instant::now", reason = "read time through the Clock port (ADR-0015)" },
    { path = "std::time::Instant::elapsed", reason = "it reads the real clock; read time through the Clock port (ADR-0015)" },
    { path = "std::time::SystemTime::now", reason = "read time through the Clock port (ADR-0015)" },
    { path = "std::time::SystemTime::elapsed", reason = "it reads the real clock; read time through the Clock port (ADR-0015)" },
    { path = "chrono::Utc::now", reason = "read time through the Clock port (ADR-0015)" },
    { path = "chrono::Local::now", reason = "read time through the Clock port (ADR-0015)", allow-invalid = true },
    { path = "getrandom::fill", reason = "draw random bytes through the SecureRandom port (ADR-0015)" },
    { path = "getrandom::fill_uninit", reason = "draw random bytes through the SecureRandom port (ADR-0015)" },
    { path = "getrandom::u32", reason = "draw random bytes through the SecureRandom port (ADR-0015)" },
    { path = "getrandom::u64", reason = "draw random bytes through the SecureRandom port (ADR-0015)" },
    { path = "rand::rng", reason = "draw random bytes through the SecureRandom port (ADR-0015)", allow-invalid = true },
    { path = "rand::random", reason = "draw random bytes through the SecureRandom port (ADR-0015)", allow-invalid = true },
    { path = "rand::random_iter", reason = "draw random bytes through the SecureRandom port (ADR-0015)", allow-invalid = true },
    { path = "rand::random_range", reason = "draw random bytes through the SecureRandom port (ADR-0015)", allow-invalid = true },
    { path = "rand::random_bool", reason = "draw random bytes through the SecureRandom port (ADR-0015)", allow-invalid = true },
    { path = "rand::random_ratio", reason = "draw random bytes through the SecureRandom port (ADR-0015)", allow-invalid = true },
    { path = "rand::fill", reason = "draw random bytes through the SecureRandom port (ADR-0015)", allow-invalid = true },
    { path = "rand::make_rng", reason = "draw random bytes through the SecureRandom port (ADR-0015)", allow-invalid = true },
    { path = "uuid::Uuid::now_v1", reason = "mint IDs with fleet_core::system::mint from the ports (ADR-0015)", allow-invalid = true },
    { path = "uuid::Uuid::now_v6", reason = "mint IDs with fleet_core::system::mint from the ports (ADR-0015)", allow-invalid = true },
    { path = "uuid::Uuid::now_v7", reason = "mint IDs with fleet_core::system::mint from the ports (ADR-0015)", allow-invalid = true },
    { path = "uuid::Uuid::new_v4", reason = "mint IDs with fleet_core::system::mint from the ports (ADR-0015)", allow-invalid = true },
    { path = "uuid::Uuid::new_v7", reason = "mint IDs with fleet_core::system::mint from the ports (ADR-0015)", allow-invalid = true },
    { path = "uuid::Timestamp::now", reason = "read time through the Clock port (ADR-0015)", allow-invalid = true },
    # Microsoft's answers are input: the Microsoft adapter reads every body through
    # its capped reader, since reqwest's own readers read without a bound (ADR-0018).
    # `json` and `text_with_charset` exist only with reqwest features fleet-server
    # doesn't enable itself (azalea-auth turns `json` on in workspace builds).
    # `reqwest::get` builds a default client without naming its type, so it's banned
    # here; the client types themselves are banned under disallowed-types below.
    { path = "reqwest::Response::json", reason = "read Microsoft's answers through the adapter's capped reader (ADR-0018)", allow-invalid = true },
    { path = "reqwest::Response::text", reason = "read Microsoft's answers through the adapter's capped reader (ADR-0018)" },
    { path = "reqwest::Response::text_with_charset", reason = "read Microsoft's answers through the adapter's capped reader (ADR-0018)", allow-invalid = true },
    { path = "reqwest::Response::bytes", reason = "read Microsoft's answers through the adapter's capped reader (ADR-0018)" },
    { path = "reqwest::get", reason = "build and hold reqwest clients only in infra/msauth/client.rs, through the adapter's one builder (ADR-0018)" },
    # Repeated from the root clippy.toml: channels are always bounded (ADR-0011).
    { path = "tokio::sync::mpsc::unbounded_channel", reason = "channels are always bounded; overload is an explicit error (CLAUDE.md, ADR-0011)", allow-invalid = true },
]

# The same guard for the types behind the OS's randomness.
disallowed-types = [
    { path = "rand::rngs::ThreadRng", reason = "draw random bytes through the SecureRandom port (ADR-0015)", allow-invalid = true },
    { path = "rand::rngs::SysRng", reason = "draw random bytes through the SecureRandom port (ADR-0015)", allow-invalid = true },
    { path = "getrandom::SysRng", reason = "draw random bytes through the SecureRandom port (ADR-0015)", allow-invalid = true },
    # reqwest's clients: only the Microsoft adapter's one builder makes one, with
    # timeouts, no redirects, no proxy and https only, and only infra/msauth/client.rs
    # names these types (its one approved `#![expect]`). A type ban, because clippy
    # can't name `Client::default`, the `Default` impl that calls `Client::new`
    # inside reqwest, where a method ban on `Client::new` doesn't reach (ADR-0018).
    { path = "reqwest::Client", reason = "build and hold reqwest clients only in infra/msauth/client.rs, through the adapter's one builder (ADR-0018)" },
    { path = "reqwest::ClientBuilder", reason = "build and hold reqwest clients only in infra/msauth/client.rs, through the adapter's one builder (ADR-0018)" },
]

# fleet-server depends on `log` only for sqlx's `LevelFilter`; all its logging goes
# through tracing, so nothing logs through a second system whose records might not
# reach the server's log layer (ADR-0015).
disallowed-macros = [
    { path = "log::error", reason = "log through tracing (ADR-0015)" },
    { path = "log::warn", reason = "log through tracing (ADR-0015)" },
    { path = "log::info", reason = "log through tracing (ADR-0015)" },
    { path = "log::debug", reason = "log through tracing (ADR-0015)" },
    { path = "log::trace", reason = "log through tracing (ADR-0015)" },
    { path = "log::log", reason = "log through tracing (ADR-0015)" },
]
