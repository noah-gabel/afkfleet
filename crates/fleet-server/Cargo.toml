[package]
name = "fleet-server"
description = "The afkfleet server: the HTTP API, authentication, the vault, persistence and the agents' control plane. A library until the afkfleet-server binary arrives in P6.11."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# SystemClock's one wall-clock read (ADR-0015).
chrono = { workspace = true, features = ["now"] }
# The domain types and the Clock and SecureRandom ports (ADR-0015).
fleet-core.workspace = true
# The config loader and errors, the `[log]` types and the log layer (ADR-0015).
fleet-startup.workspace = true
garde = { workspace = true, features = ["derive"] }
# OsRandom's one read of the OS's randomness (ADR-0015).
getrandom.workspace = true
# Only `log::LevelFilter`, for sqlx's statement-logging levels; clippy.toml bans its
# logging macros (ADR-0015).
log.workspace = true
serde = { workspace = true, features = ["derive"] }
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite-bundled", "macros", "migrate"] }
thiserror.workspace = true
# Creating the database file and checking its permissions without blocking (ADR-0015).
tokio = { workspace = true, features = ["fs"] }
tracing.workspace = true

[dev-dependencies]
# `figment::Jail`, the type `in_jail` hands each config test (ADR-0015).
figment = { workspace = true, features = ["test"] }
fleet-testkit.workspace = true
rstest.workspace = true
# A fresh folder for each database test (ADR-0015).
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
# A scoped subscriber around fleet-startup's layer, for the dev-mode warning's
# test (ADR-0015).
tracing-subscriber.workspace = true
