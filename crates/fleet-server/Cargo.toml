[package]
name = "fleet-server"
description = "The afkfleet server: the HTTP API, authentication, the vault, persistence and the agents' control plane. A library until the afkfleet-server binary arrives in P6.11."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# The config loader and errors, the `[log]` types and the log layer (ADR-0015).
fleet-startup.workspace = true
garde = { workspace = true, features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
# `figment::Jail`, the type `in_jail` hands each config test (ADR-0015).
figment = { workspace = true, features = ["test"] }
fleet-testkit.workspace = true
rstest.workspace = true
# A scoped subscriber around fleet-startup's layer, for the dev-mode warning's
# test (ADR-0015).
tracing-subscriber.workspace = true
