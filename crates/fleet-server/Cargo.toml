[package]
name = "fleet-server"
description = "The afkfleet server: the HTTP API, authentication, the vault, persistence and the agents' control plane. The afkfleet-server binary runs it."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "afkfleet-server"
path = "src/main.rs"

[dependencies]
# The password service: Argon2id with salts from the SecureRandom port (ADR-0016).
argon2 = { workspace = true, features = ["alloc", "password-hash", "zeroize"] }
# The ports, which services hold as `Arc<dyn …>` (ADR-0015).
async-trait.workspace = true
# The vault's key files: standard base64, decoded into a fixed buffer (ADR-0016).
base64.workspace = true
# The vault's XChaCha20-Poly1305, with nonces from the SecureRandom port (ADR-0016).
chacha20poly1305 = { workspace = true, features = ["alloc", "zeroize"] }
# The HTTP layer: `matched-path`, so the trace layer logs the route's template, never
# the path a client sent; `tokio` and `http1` for `axum::serve` (Caddy speaks HTTP/1.1 to
# it); `json` for the request bodies and `query` for the lists' query strings, whose
# rejections the server maps itself; `ws` for the live events socket (P11.5, ADR-0020, U11),
# which brings tokio-tungstenite and tungstenite 0.29.0. The error body is written with
# serde_json (ADR-0015, ADR-0016).
axum = { workspace = true, features = ["http1", "json", "matched-path", "query", "tokio", "ws"] }
# `TypedHeader<Authorization<Bearer>>` for AuthUser (ADR-0016).
axum-extra = { workspace = true, features = ["typed-header"] }
# SystemClock's one wall-clock read (ADR-0015).
chrono = { workspace = true, features = ["now"] }
# The afkfleet-server command line (ADR-0015).
clap = { workspace = true, features = ["derive"] }
# The error envelope's DTOs (ADR-0015).
fleet-api-types.workspace = true
# The domain types and the Clock and SecureRandom ports (ADR-0015).
fleet-core.workspace = true
# The control plane's wire format: the enrollment's messages and the generated service
# (ADR-0019).
fleet-proto.workspace = true
# The config loader and errors, the `[log]` types and the log layer (ADR-0015).
fleet-startup.workspace = true
garde = { workspace = true, features = ["derive"] }
# OsRandom's one read of the OS's randomness (ADR-0015).
getrandom.workspace = true
# The HTTP rate limits: keyed limiters on an injected clock, `std` only (ADR-0016).
governor = { workspace = true, features = ["std"] }
# HMAC-SHA256 keys of the lockout's rows; `zeroize` wipes the keyed state (ADR-0016).
hmac = { workspace = true, features = ["zeroize"] }
# The QR code of a TOTP enrollment, written as an SVG by the server (ADR-0016).
qrcodegen.workspace = true
# The control plane's PKI (infra::pki): the CA and the server certificate of `pki init`, and
# agents' certificates signed from their CSRs. `aws_lc_rs` signs and verifies (x509-parser's
# `verify-aws` checks a CSR's signature), `pem` writes and reads the files, `x509-parser`
# reads CSRs and the CA certificate, `zeroize` wipes a key pair's PKCS#8 copy. Every key is
# Ed25519 from the SecureRandom port (ADR-0019). The Microsoft adapter's certificate test
# makes its CA and server certificate with it too (ADR-0018).
rcgen = { workspace = true, features = ["aws_lc_rs", "pem", "x509-parser", "zeroize"] }
# Reading the PKI's certificates at serve's startup: the CA flag, the server certificate's
# names and validity (the user's choice, ADR-0019); rcgen 0.14 no longer parses certificates.
x509-parser.workspace = true
# Only `log::LevelFilter`, for sqlx's statement-logging levels; clippy.toml bans its
# logging macros (ADR-0015).
log.workspace = true
# The Microsoft adapter's own HTTP client (infra::msauth): rustls with aws-lc-rs from
# the workspace, and `form` for the OAuth form bodies. Answers are read through the
# adapter's capped reader; clippy.toml bans reqwest's unbounded readers (ADR-0018).
reqwest = { workspace = true, features = ["form"] }
# `user create-owner`'s hidden password prompt (ADR-0016).
rpassword.workspace = true
# `serve` installs aws-lc-rs as the process's one rustls provider at startup, and the
# Microsoft adapter finds a refused certificate in its errors (ADR-0018).
rustls.workspace = true
# PasswordHash holds the hash as a SecretString: redacted Debug, zeroized (ADR-0015).
secrecy.workspace = true
serde = { workspace = true, features = ["derive"] }
# SHA-256 of the session tokens, the only form the database holds; `zeroize` wipes the
# hasher's buffer, which held the token's tail (ADR-0016).
sha2 = { workspace = true, features = ["zeroize"] }
# Reading the audit log's metadata JSON back (ADR-0015).
serde_json.workspace = true
# Constant-time comparison of secrets, first the vault's duplicate-key check (ADR-0016).
subtle.workspace = true
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite-bundled", "macros", "migrate", "uuid"] }
thiserror.workspace = true
# One TOTP step's code and the otpauth URI; `zeroize` wipes its Secret (ADR-0016).
totp-rs = { workspace = true, features = ["otpauth", "zeroize"] }
# The agents' gRPC port (grpc/): `server` serves it, `router` adds its services, and
# `tls-aws-lc` (which turns on `tls-connect-info`) is its TLS on aws-lc-rs, the process's one
# provider, giving each call its peer's address. Never `tls-ring` or a roots feature (ADR-0019).
tonic = { workspace = true, features = ["router", "server", "tls-aws-lc"] }
# Creating the database file and checking its permissions without blocking, the trace
# layer's latency from tokio's clock, the binary's runtimes, the listener and the
# healthcheck's TCP probe (ADR-0015), and the password service's semaphores (ADR-0016).
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
# `ServiceBuilder`, which lists the middleware stack outermost first (ADR-0015).
tower.workspace = true
# Each agent's `Connect` stream answers from a `ReceiverStream` over its bounded queue, and
# the gRPC listener maps its accepted sockets with `StreamExt` (ADR-0019).
tokio-stream.workspace = true
# `CancellationToken`, which asks axum's server to shut down gracefully (ADR-0015), and
# `rt` for the `TaskTracker` that owns the session-token service's refreshes (ADR-0018).
tokio-util = { workspace = true, features = ["rt"] }
# The middleware stack's tower-http layers; the request-ID and trace layers are
# the server's own (ADR-0015).
tower-http = { workspace = true, features = ["catch-panic", "limit", "sensitive-headers", "set-header", "timeout"] }
tracing.workspace = true
# The OpenAPI document, served only in dev mode (P6.10): `OpenApi` and `#[utoipa::path]`,
# with utoipa-axum's `OpenApiRouter`, so every route carries its entry (ADR-0015).
utoipa = { workspace = true, features = ["macros"] }
utoipa-axum.workspace = true
# IDs are bound and read as `uuid::fmt::Hyphenated` text (ADR-0015).
uuid.workspace = true
# `Zeroizing` buffers for passwords read from stdin, and wiping a typed one (ADR-0016).
zeroize.workspace = true
# The strength check of new passwords, run with the hashing (ADR-0016).
zxcvbn.workspace = true

[dev-dependencies]
# `figment::Jail`, the type `in_jail` hands each config test (ADR-0015).
figment = { workspace = true, features = ["test"] }
fleet-testkit.workspace = true
# `SinkExt`, for the live events tests' client to send frames (P11.5, ADR-0020, U11).
futures-util = { workspace = true, features = ["sink"] }
# `rt::TokioIo`, which hands tonic's client an in-memory pipe in the control plane's
# paused-time test (U6, ADR-0019).
hyper-util = { workspace = true, features = ["tokio"] }
# The migrations' checksum snapshot, and the error responses' JSON snapshots (ADR-0015).
insta = { workspace = true, features = ["json"] }
# The property test that checks IpNet against an independent implementation (ADR-0016).
ipnet.workspace = true
# The time conversion's round trip and order (ADR-0015).
proptest = { workspace = true, features = ["std"] }
rstest.workspace = true
# A fresh folder for each database test (ADR-0015).
tempfile.workspace = true
# The loopback tests' client of the gRPC port, over TLS on aws-lc-rs (ADR-0019).
tonic = { workspace = true, features = ["channel", "tls-aws-lc"] }
# `test-util`: the request timeout's test runs on paused time (ADR-0015).
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
# The live events tests' WebSocket client, plain ws:// to 127.0.0.1 (P11.5, ADR-0020, U11).
tokio-tungstenite = { workspace = true, features = ["connect"] }
# `ServiceExt::oneshot`, for requests through a router in tests (ADR-0015).
tower = { workspace = true, features = ["util"] }
# A scoped subscriber around fleet-startup's layer, for the dev-mode warning's
# test (ADR-0015).
tracing-subscriber.workspace = true
