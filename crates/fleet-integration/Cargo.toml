[package]
name = "fleet-integration"
description = "Tests only: the real afkfleet server and the real managed agent together, in-process over mTLS on loopback (P10.9), and the Phase 10 DoD check."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

# Nothing but its tests: nothing depends on this crate, and everything it uses is a
# dev-dependency (the user's choices, ADR-0019, U19 and U21).
[dev-dependencies]
# The DoD check's recording wrapper around the Microsoft adapter, a port
# fleet-server holds as Arc<dyn …>.
async-trait.workspace = true
# Bot IDs and the agent's run anchor.
chrono.workspace = true
# The real managed agent, run in-process: its config, enrollment and run.
fleet-agent.workspace = true
# The API's DTOs the Owner's client sends and reads.
fleet-api-types.workspace = true
# The Owner's client of the real HTTP API.
fleet-client.workspace = true
# IDs, names, the agents' retry policies.
fleet-core.workspace = true
# The agent's Minecraft config (`McConfig`); the bots run on fleet-testkit's fake.
fleet-mc.workspace = true
# The agent's runtime config.
fleet-runtime.workspace = true
# The real server: serve's wiring, its PKI commands, its database.
fleet-server.workspace = true
# The stop signals both binaries share.
fleet-startup.workspace = true
# The fake connector, ManualClock, SeededRandom and the log buffer.
fleet-testkit.workspace = true
rstest.workspace = true
# The process's one rustls provider, aws-lc-rs.
rustls.workspace = true
# The Owner's password and the vault key in their secret wrappers.
secrecy.workspace = true
# Each test's folder: the database, the PKI, the agents' identities.
tempfile.workspace = true
# The DoD check's online-mode Minecraft server in Docker.
testcontainers.workspace = true
# `net` and `io-util` for the stalling proxy; `rt-multi-thread` and `fs` for the
# DoD check, beside azalea's host threads.
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
# The Owner's authenticator: codes from the enroll answer's otpauth URI.
totp-rs = { workspace = true, features = ["otpauth"] }
tracing.workspace = true
# One subscriber over the log buffer for the server's and the agents' lines.
tracing-subscriber.workspace = true
