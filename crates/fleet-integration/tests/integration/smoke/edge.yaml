# The smoke test's stand-in for an operator's existing reverse proxy in a
# container (ADR-0022, S16, S19): a project of its own, `afkfleet-smoke-edge`,
# joined to the afkfleet project's edge network at the address the server
# trusts, doing only what the runbook asks of such a proxy (edge.Caddyfile).
# Caddy's image again, pinned as deploy/compose.caddy.yaml pins it (a test
# holds the two equal), so no other image is needed.
services:
  proxy:
    image: caddy:2.11.9-alpine@sha256:0bbb055bda6793c999bde78b1b5ce3e89f829fb031af2cf50056ea1246559fee
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    # As deploy/compose.caddy.yaml keeps it (ADR-0022, S21; ADR-0024).
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    environment:
      AFKFLEET_DOMAIN: localhost
    ports:
      - "127.0.0.1::443"
    volumes:
      - ./edge.Caddyfile:/etc/caddy/Caddyfile:ro
    tmpfs:
      - /tmp:size=16m
      - /config:size=1m,uid=65532,gid=65532,mode=0700
      - /data:size=16m,uid=65532,gid=65532,mode=0700
    networks:
      edge:
        ipv4_address: ${AFKFLEET_PROXY_ADDRESS:?}

networks:
  edge:
    external: true
    name: ${AFKFLEET_EDGE_NETWORK:?}
