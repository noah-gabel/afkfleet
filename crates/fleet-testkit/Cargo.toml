[package]
name = "fleet-testkit"
description = "Test doubles and helpers for afkfleet: scriptable fakes for the fleet-core ports, log captures and figment's Jail. A dev-dependency only."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# ManualClock's time (ADR-0015).
chrono.workspace = true
# `Jail`, for every config test in the workspace (ADR-0015).
figment = { workspace = true, features = ["test"] }
fleet-core.workspace = true
# SeededRandom's seeded StdRng (ADR-0015).
rand = { workspace = true, features = ["std_rng"] }
# The log buffer's JSON lines (ADR-0015).
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
# The log capture for redaction tests (ADR-0011) and the log buffer.
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# The log capture's own test emits a `log` record to prove the bridge.
log.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
