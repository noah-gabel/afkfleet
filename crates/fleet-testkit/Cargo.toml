[package]
name = "fleet-testkit"
description = "Test doubles for afkfleet: scriptable fakes for the fleet-core ports. A dev-dependency only."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
fleet-core.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
# The log capture for redaction tests (ADR-0011).
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# The log capture's own test emits a `log` record to prove the bridge.
log.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
