[package]
name = "fleet-script"
description = "Scripted modes: the sandboxed Rhai engine, validation, the instance that runs a script's hooks, and the API's objects. Pure and synchronous: no IO, no tokio, no azalea."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
chrono.workspace = true
fleet-core.workspace = true
jiff.workspace = true
rand = { workspace = true, features = ["std_rng"] }
rhai.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The stopwatch a test times a hook with (ADR-0040's amendment).
fleet-testkit.workspace = true
# The memory test's counting allocator, in its own test binary (ADR-0040).
peak_alloc.workspace = true
proptest = { workspace = true, features = ["std"] }
rstest.workspace = true

# The suite is one binary, so Rhai is linked once; the memory test replaces the allocator
# and is a binary of its own.
[[test]]
name = "suite"
path = "tests/suite/main.rs"
