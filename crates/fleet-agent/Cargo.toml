[package]
name = "fleet-agent"
description = "The afkfleet agent: loads its config, sets up logging and runs the bots through fleet-runtime and fleet-mc. The afkfleet-agent binary is the first runnable product."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "afkfleet-agent"
path = "src/main.rs"

[dependencies]
# `now` only: one wall-clock read at startup, for the runtime's anchor and the bot IDs.
chrono = { workspace = true, features = ["now"] }
clap = { workspace = true, features = ["derive"] }
fleet-core.workspace = true
# The control plane's wire format: the enrollment's messages and the generated client
# (ADR-0019).
fleet-proto.workspace = true
fleet-mc.workspace = true
fleet-runtime.workspace = true
# The config loader and errors, the `[log]` types and the log layer (ADR-0015).
fleet-startup.workspace = true
garde = { workspace = true, features = ["derive"] }
getrandom.workspace = true
# `enroll`'s key and CSR: an Ed25519 key from getrandom's 32 bytes, its CSR, and its PEM
# (`pem`); `aws_lc_rs` signs, `zeroize` wipes the key pair's PKCS#8 copy. Never
# `KeyPair::generate` (ADR-0019, S10).
rcgen = { workspace = true, features = ["aws_lc_rs", "pem", "zeroize"] }
# The agent records fleet-mc's diagnostics itself.
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
rustls.workspace = true
# The enrollment bundle's token stays in a `SecretString` (ADR-0019, S15).
secrecy.workspace = true
serde = { workspace = true, features = ["derive"] }
# SHA-256 of the CA certificate, checked against the bundle's pin (the user's choice,
# ADR-0019, U4).
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util.workspace = true
# The outbox's `Connect` request body is a `Stream`, which tonic pulls when HTTP/2 has
# room (the user's choice, ADR-0019, U18).
tokio-stream.workspace = true
# `enroll`'s client of the server's gRPC port: `channel` dials it, `tls-aws-lc` its TLS on
# aws-lc-rs, trusting only the pinned CA. Never `tls-ring` or a roots feature (ADR-0019).
tonic = { workspace = true, features = ["channel", "tls-aws-lc"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
# The bundle read from stdin is wiped once parsed (ADR-0019, S15).
zeroize.workspace = true

[dev-dependencies]
# `figment::Jail`, the type `in_jail` hands each test, and `Toml` for the
# compose test's config reads (ADR-0014, ADR-0015).
figment = { workspace = true, features = ["test", "toml"] }
fleet-testkit.workspace = true
# `log` records, to prove the bridge into tracing keeps their targets (ADR-0014).
log.workspace = true
rstest.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["test-util"] }
# `enroll`'s tests: a fake gRPC port over TLS, its certificates signed with rcgen (ADR-0019).
tonic = { workspace = true, features = ["router", "server", "tls-aws-lc"] }
