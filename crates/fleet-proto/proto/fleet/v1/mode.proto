// A bot's mode as it crosses the wire: the steps or the script of a validated
// mode, which the receiver checks again with the mode rules of fleet-core
// (ADR-0019; ADR-0036, D13).
syntax = "proto3";

package fleet.v1;

import "fleet/v1/common.proto";

// What a bot does while it's online: steps, or a script. A scripted mode has
// `script` and no steps. An agent from before scripts would skip `script` and
// read a mode that does nothing, so the server sends a scripted mode only to
// an agent whose hello says it runs its API level (Hello.script_api).
message ModeDefinition {
  // The steps, in the order they run when several are due at once.
  repeated Step steps = 1;
  // The script, with what the mode sets and declares beside it.
  Script script = 2;
}

// A scripted mode's body (ADR-0036, D13; ADR-0037).
message Script {
  // The script API level the mode was validated at, from 1.
  uint32 api = 1;
  // The script's text, at most 16 KiB.
  string source = 2;
  // The leash's radius, 1 to 64 blocks.
  uint32 leash = 3;
  // How many uses the tool guard keeps, 0 (off) to 100.
  uint32 tool_guard = 4;
  // The blocks a held left button mines, as registry identifiers; none for
  // any block (ADR-0042, G13).
  repeated string block_guard = 5;
  // The messages the script may send, at most 16.
  repeated DeclaredMessage messages = 6;
  // The chat lines the script reads, at most 8.
  repeated ChatPattern patterns = 7;
}

// A message a scripted mode declares: the only text its script can send.
message DeclaredMessage {
  // The key a script names it by.
  string key = 1;
  // The text, with a `{name}` where each value goes.
  string text = 2;
  // The values the text holds.
  repeated DeclaredValue values = 3;
}

// A declared message's value: its name, and what it may be.
message DeclaredValue {
  // The value's name, as the text writes it in braces.
  string name = 1;
  // What it may be.
  oneof kind {
    // A whole number in a range.
    IntegerRange integer = 2;
    // A decimal number in a range, with fixed places.
    DecimalRange decimal = 3;
    // One of a closed list of words.
    Words word = 4;
  }
}

// A whole number from `min` to `max`.
message IntegerRange {
  // The smallest value.
  int64 min = 1;
  // The largest value.
  int64 max = 2;
}

// A decimal number from `min` to `max`, written with exactly `places` digits
// after the point.
message DecimalRange {
  // The smallest value.
  double min = 1;
  // The largest value.
  double max = 2;
  // How many digits follow the point, 1 to 4.
  uint32 places = 3;
}

// A closed list of words, each 1 to 32 characters without whitespace.
message Words {
  // The words.
  repeated string options = 1;
}

// A line of the server's own chat a scripted mode declares it reads
// (ADR-0037, C3).
message ChatPattern {
  // The key a script knows it by.
  string key = 1;
  // When it counts.
  PatternWhen when = 2;
  // The line, with a `{name}` where each capture is.
  string text = 3;
  // The captures the text holds, at most 4.
  repeated PatternCapture captures = 4;
}

// When a chat pattern counts.
enum PatternWhen {
  // Not set; never valid.
  PATTERN_WHEN_UNSPECIFIED = 0;
  // Only inside a window the script opened after a command of its own.
  PATTERN_WHEN_REPLY = 1;
  // Whenever the bot is online.
  PATTERN_WHEN_ANY_TIME = 2;
}

// A chat pattern's capture: its name, and what it reads.
message PatternCapture {
  // The capture's name, as the text writes it in braces.
  string name = 1;
  // What it reads.
  oneof kind {
    // A whole number in a range.
    IntegerRange integer = 2;
    // An amount in a range.
    AmountRange amount = 3;
    // One of a closed list of words.
    Words word = 4;
  }
}

// An amount, as servers write one, from `min` to `max`.
message AmountRange {
  // The smallest value that counts.
  double min = 1;
  // The largest value that counts.
  double max = 2;
  // Which character comes before its decimals.
  DecimalMark decimal_mark = 3;
}

// Which character an amount writes before its decimals; the other is its
// thousands separator.
enum DecimalMark {
  // Not set; never valid.
  DECIMAL_MARK_UNSPECIFIED = 0;
  // `1,234.56`.
  DECIMAL_MARK_POINT = 1;
  // `1.234,56`.
  DECIMAL_MARK_COMMA = 2;
}

// One entry of a mode: what the bot does, when, and how likely.
message Step {
  // What the bot does.
  Action action = 1;
  // When it does it.
  Schedule schedule = 2;
  // The chance in percent, 1 to 100, that the step runs each time it's due.
  uint32 probability = 3;
}

// What a step makes the bot do. Angles are in degrees.
message Action {
  // The action.
  oneof action {
    // Look in a fixed direction.
    Look look = 1;
    // Turn by a random amount.
    RotateRandom rotate_random = 2;
    // Jump once.
    Unit jump = 3;
    // Start or stop sneaking.
    Sneak sneak = 4;
    // Swing the main arm.
    Unit swing_arm = 5;
    // Use the held item.
    Unit use_item = 6;
    // Hold the use button down, or let go of it.
    HoldUse hold_use = 7;
    // Attack the entity the bot looks at.
    Unit attack_facing_entity = 8;
    // Select a hotbar slot.
    SelectHotbarSlot select_hotbar_slot = 9;
    // Send a chat message or a command.
    SendChat send_chat = 10;
    // Get into the nearest minecart within reach. A reader that doesn't know
    // this case sees the oneof unset and refuses the whole message.
    Unit enter_minecart = 11;
  }

  // A fixed direction.
  message Look {
    // Degrees, -180 to 180.
    float yaw = 1;
    // Degrees, -90 to 90.
    float pitch = 2;
  }

  // The largest random turn in either direction.
  message RotateRandom {
    // Degrees, 0 to 180.
    float max_yaw = 1;
    // Degrees, 0 to 90.
    float max_pitch = 2;
  }

  // Whether the bot sneaks from now on.
  message Sneak {
    // Sneaking or not.
    bool on = 1;
  }

  // Whether the bot holds the use button from now on.
  message HoldUse {
    // Holding or not.
    bool on = 1;
  }

  // A hotbar slot, 0 to 8 from left to right.
  message SelectHotbarSlot {
    // The slot.
    uint32 slot = 1;
  }

  // A chat message or a command, in its validated form.
  message SendChat {
    // The text.
    string message = 1;
  }
}

// When a step runs.
message Schedule {
  // The schedule.
  oneof schedule {
    // Once, right after the bot joins.
    Unit at_start = 1;
    // Again and again while the bot is online.
    Every every = 2;
    // Once each time the bot is alive again after a death, as soon as the
    // server confirmed the respawn it asked for. A reader that doesn't know
    // this case sees the oneof unset and refuses the whole message.
    Unit on_respawn = 3;
  }

  // A repeating schedule. Each gap is uniform between the interval and the
  // interval plus the jitter.
  message Every {
    // The shortest gap, in milliseconds.
    uint64 interval_ms = 1;
    // How much longer a gap may be, in milliseconds.
    uint64 jitter_ms = 2;
  }
}
