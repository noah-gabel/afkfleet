# The server's development config, for `just dev-server` on the host only.
#
# DEVELOPMENT ONLY: dev mode serves development-only features, such as the
# OpenAPI document at /api/openapi.json, and the server warns about it at
# startup. Never run a production server with this file.
#
# The database path and the vault key file's path must be absolute, and a
# committed file can't hold ones that work on every machine, so they aren't set
# here: `just dev-server` passes AFKFLEET_SERVER__DATABASE__PATH, by default
# target/dev-server/afkfleet.db in the repository, and
# AFKFLEET_SERVER__VAULT__MASTER_KEY_FILES__1, target/dev-server/vault-key-1,
# which it creates when it's missing (ADR-0016). Keys left out take their
# defaults (Plan.md P6.2, Appendix A); AFKFLEET_SERVER__… environment variables
# override any key, e.g. AFKFLEET_SERVER__LOG__FILTER=debug.

dev_mode = true

# [http]
# bind = "127.0.0.1:8080"                # an IP address and a port other than 0
# request_timeout_secs = 15              # 1–19, below the desktop client's 20 s; the shutdown waits this long for requests, plus 5 s for the database
# max_body_bytes = 65536                 # 1024–1048576
# trusted_proxies = []                   # CIDR networks of reverse proxies whose X-Forwarded-For counts; none in dev

[log]
format = "pretty"
filter = "info"                          # EnvFilter syntax; azalea_auth stays at info

[vault]
active_key_id = 1                        # the key in master_key_files.1, from just dev-server

[accounts]
allow_offline = true                     # dev only: offline-mode test server

# [grpc]                                 # the agents' port: `just dev-server` turns it on with
#                                        # the four AFKFLEET_SERVER__GRPC__*_FILE paths of the
#                                        # PKI it creates in target/dev-server/pki/ (ADR-0019)
# bind = "127.0.0.1:7443"                # an IP address and a port other than 0 and [http]'s
# agent_cert_lifetime_days = 60          # 1–365
# heartbeat_interval_secs = 10           # 1–60: Welcome tells the agent, and the port pings a
#                                        # connection it read nothing from for this long
# heartbeat_timeout_secs = 30            # 2–300, at least twice the interval: a stream that
#                                        # sent nothing for this long ends (ADR-0019)
