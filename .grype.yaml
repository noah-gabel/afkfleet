# Grype's configuration for `just image-scan` (the weekly Audit), read from the repository's root.
# Each ignore names one finding in Caddy's pinned image that our setup can't reach, pinned to the
# package's exact version, so it stops matching as soon as a Caddy image updates that package and
# any finding in another version still fails the scan (ADR-0024; ADR-0022, U12). Remove an entry
# once the pinned Caddy image no longer holds that version.
ignore:
  - vulnerability: GO-2026-6860
    reason: "Caddy 2.11.9's golang.org/x/net/html: quadratic allocations parsing crafted HTML. Our Caddyfile parses no HTML (no templates, no markdown); it only reverse-proxies the API (ADR-0024)."
    package:
      name: golang.org/x/net
      version: v0.60.0
      type: go-module
  - vulnerability: GO-2026-6865
    reason: "Caddy 2.11.9's klauspost/compress: a panic on two-block frames. Caddy uses it for the encode directive's compression, which our Caddyfile doesn't use (ADR-0024)."
    package:
      name: github.com/klauspost/compress
      version: v1.20.1
      type: go-module
  - vulnerability: CVE-2026-4738
    reason: "Alpine's zlib in Caddy's image: Caddy is a static Go binary, and probe and files run busybox, so no process of ours loads it (ADR-0024)."
    package:
      name: zlib
      version: 1.3.2-r1
      type: apk
